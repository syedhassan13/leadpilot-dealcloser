# Pushes the API to your Hugging Face Space on every push to main.
# Needs repo secrets: HF_TOKEN (write token) and HF_SPACE (e.g. "your-name/leadpilot").
name: Deploy API to Hugging Face
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the Space folder
        run: |
          mkdir space
          cp -r backend frontend Dockerfile .dockerignore space/
          cat > space/README.md <<'MD'
          ---
          title: LeadPilot API
          emoji: 🚗
          colorFrom: indigo
          colorTo: blue
          sdk: docker
          app_port: 7860
          pinned: false
          ---
          LeadPilot (DealCloser) agent API. Endpoints: POST /chat, GET /health. Website at /ui/.
          MD
          sed -i 's/^          //' space/README.md
      - name: Upload to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ secrets.HF_SPACE }}
        run: |
          pip install -q huggingface_hub
          python -c "
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ['HF_TOKEN'])
          api.create_repo(os.environ['HF_SPACE'], repo_type='space', space_sdk='docker', exist_ok=True)
          api.upload_folder(folder_path='space', repo_id=os.environ['HF_SPACE'], repo_type='space',
                            commit_message='Deploy from GitHub', delete_patterns=['backend/**', 'frontend/**'])
          "
